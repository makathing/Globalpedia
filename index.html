<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Globalpedia" />
    <title>Globalpedia — spin the world, learn a country</title>
    <meta name="description" content="A 3D school globe you can spin. Tap a country to see photos and a kid-friendly encyclopedia entry." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23bfe3f5' stroke='%233b2f2a' stroke-width='2'/%3E%3Cpath d='M8 12c4-3 8 1 12-1M6 20c5 2 10-2 16 1' fill='none' stroke='%233b2f2a' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://en.wikipedia.org" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <!-- Fonts, loaded so they can never hold the page hostage. `media="print"` means the
         browser fetches this sheet at low priority and does not block first paint or script
         execution on it; the onload flips it to `all` the moment it lands, and `display=swap`
         redraws the text in place. If fonts.googleapis.com is slow or unreachable the site
         still boots on the fallback stacks in app.css — which is the whole point, and is not
         what an `@import` inside the stylesheet would have done. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap"
      />
    </noscript>
    <script>
      /* Apply the saved theme before first paint so there is no flash of the default.
         Only the paper color and color-scheme are set here; src/ui/theme.ts applies the
         full token set from src/core/themes.ts once the module loads. Keep the ids and
         paper colors below in sync with that table. */
      (function () {
        var PAPER = {
          classroom: '#fbf8f1',
          chalkboard: '#2a3733',
          atlas: '#e8dcc0',
          blueprint: '#12243f',
          fieldnotes: '#eef3e6',
          nightstudy: '#171d2b'
        };
        var DARK = { chalkboard: 1, blueprint: 1, nightstudy: 1 };
        var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
        var id = null;
        try { id = localStorage.getItem('gp:theme'); } catch (e) { /* privacy mode */ }
        // hasOwnProperty, not a bare lookup: 'constructor' and 'toString' are truthy on any
        // object, so a poisoned value used to pass validation and stamp a garbage paper colour.
        // And no dark-mode branch — everyone opens in Classroom unless they chose otherwise.
        if (!id || !has(PAPER, id)) id = 'classroom';
        var r = document.documentElement;
        r.setAttribute('data-theme', id);
        r.style.setProperty('--gp-paper', PAPER[id]);
        r.style.setProperty('color-scheme', has(DARK, id) ? 'dark' : 'light');
        r.style.backgroundColor = PAPER[id];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', PAPER[id]);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header id="header"></header>
      <main id="stage">
        <div id="globe"></div>
        <aside id="panel" aria-live="polite"></aside>
      </main>
      <footer id="footer"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
